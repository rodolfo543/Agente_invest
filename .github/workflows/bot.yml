name: Autonomous Foxbit Trading Bot

on:
  schedule:
    # Executa de segunda a sexta às 14:30 UTC
    - cron: '30 14 * * 1-5'
    # Executa de segunda a sexta às 20:00 UTC
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # Permite execução manual pelo painel do GitHub

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar Robô de Investimentos
      env:
        FOXBIT_API_KEY: ${{ secrets.FOXBIT_API_KEY }}
        FOXBIT_SECRET_KEY: ${{ secrets.FOXBIT_SECRET_KEY }}
        FOXBIT_CLIENT_ID: ${{ secrets.FOXBIT_CLIENT_ID }}
        FOXBIT_BASE_URL: ${{ secrets.FOXBIT_BASE_URL }}
        SIMULATION_MODE: ${{ secrets.SIMULATION_MODE }}
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TARGET_TICKERS: ${{ secrets.TARGET_TICKERS }}
      run: python main.py

    - name: Commitar e Atualizar Estado no GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Verifica se o arquivo estado.json foi criado ou modificado
        git add estado.json
        
        # Só realiza o commit se houver alterações para evitar erros no step
        if ! git diff --cached --exit-code; then
          git commit -m "bot: atualização automática do estado.json [skip ci]"
          git push
        else
          echo "Nenhuma alteração no estado.json para commitar."
        fi
